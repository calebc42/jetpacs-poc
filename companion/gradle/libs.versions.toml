[versions]
agp = "9.1.1"
kotlin = "2.1.10"
compose-bom = "2026.02.01"
activity-compose = "1.10.0"
# Runtime only (tree API, no @Serializable) — the release line for Kotlin 2.1.x.
kotlinx-serialization = "1.8.0"
# 0.6.2 is the ONLY possible pin on Kotlin 2.1.10 — 0.7.x needs stdlib >= 2.1.20 (kotlin.time.Instant).
kotlinx-datetime = "0.6.2"
junit = "4.13.2"
compose-icons = "1.7.8"
# RF-1b. 4.16 is a HARD FLOOR: 4.15.1 refuses to run at all while
# targetSdk=36 ("Package targetSdkVersion=36 > maxSdkVersion=35", a
# class-level initializationError). Literal, never a range — maven-metadata
# reports BOTH <latest> and <release> as 4.17-beta-2.
robolectric = "4.16.1"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# Last standalone release; the icons artifacts left the Compose BOM in 2024.
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-icons" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Both Compose test artifacts are BOM-managed (1.10.4 under compose-bom
# 2026.02.01) — RF-1b adds no version pin beyond Robolectric itself.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
