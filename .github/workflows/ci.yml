# RF-1a (PLAN-refound) laid down four jobs with no new dependencies;
# RF-1c added the fifth (loopback).  Every green number stops being
# demonstrated-once the moment this file lands — red-on-regression is
# itself demonstrated by the three-red gate recorded in the RF-1a
# status note, and by RF-1c's own bite gate.
#
# Documented exclusions (no silent caps):
#   - device tests stay manual: 33 of the 48 test/smoke-*.el drivers
#     need `adb shell input` taps and can never run deviceless.  The
#     rest CAN dial the RF-2.6 host but are not green from --batch
#     (they assert before pumping — written for an interactive Emacs);
#     converting them is RF-1d, with the inventory in PLAN-rf1-close;
#   - lint is not wired (not in RF-1a's job table; add deliberately or
#     not at all).
#
# Two non-obvious facts this file depends on (verified 2026-07-31):
#   - the WIRE job, not the spec job, is the real cross-repo binding:
#     five :wire jvmTest suites resolve fixtures through the ebp.dir
#     system property (wired in wire/build.gradle.kts) and error()
#     when unset — hence submodules: recursive on every job that
#     touches Gradle or validate.py;
#   - local.properties is gitignored; the :app build finds the SDK via
#     the runner's preinstalled ANDROID_HOME.
#
# A third, added by RF-1c: the loopback job is the ONLY one that can
# go red on an elisp<->Kotlin disagreement.  Every other job tests one
# side against its own fixtures — which is exactly the "demonstrated,
# not enforced" gap RF-1 exists to close, one level up.

name: CI

on:
  push:
    branches: ["slop-fork/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    name: wire (:wire:jvmTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Wire suite (goldens + fixtures via ebp.dir)
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :wire:jvmTest --console=plain

  app:
    name: app (:app unit tests + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # RF-1b: Robolectric fetches its 203.5 MiB android-all-instrumented
      # jar at TEST runtime, through its own Maven resolver into ~/.m2 —
      # which setup-gradle does not cache. Measured: ~27 s cold vs ~6 s
      # warm, so this cache is the whole difference. The key carries the
      # Robolectric pin, so a version bump invalidates it correctly.
      - name: Cache the Robolectric android-all jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('companion/gradle/libs.versions.toml') }}
      - name: Unit tests and APK
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ebp-companion-debug-apk
          path: companion/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  spec:
    name: spec (validate.py + I1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # I1: ebp/ is frozen through RF-2.  In a fresh checkout the
      # working-tree half is vacuous by construction; the load-bearing
      # halves are the in-sync submodule pointer and validate.py green
      # against exactly the pinned artifacts.
      - name: I1 — submodule in sync, tree clean
        run: |
          git submodule status ebp | grep -q '^ ' \
            || { echo "submodule pointer out of sync"; exit 1; }
          test -z "$(git status --short ebp/)" \
            || { git status --short ebp/; exit 1; }
      - name: validate.py (goldens, contract, check_spec_sync)
        run: python3 ebp/validate.py

  elisp:
    name: elisp (guards + 30 ERT suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      # No EBP_HOST_LAUNCH here on purpose: this job pins the DEFAULT
      # path, where the RF-2.6 host suite skips and the run is exactly
      # what it was before that rung.  The loopback job below is where
      # the host actually runs.
      - name: run-tests.sh (delineation guard, byte-compile guard, ERT)
        run: test/run-tests.sh

  loopback:
    # RF-1c: the first CI job that can fail because the two
    # implementations disagree.  It needs BOTH toolchains — Java to
    # build the host jar, Emacs to drive the client against it — which
    # is why it is its own job and not a step in either neighbour.
    name: loopback (elisp <-> Kotlin, live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      # The host's socket-level pins (accept loop, framing, newest-wins,
      # config rejection) had no CI coverage until this job existed.
      - name: Host pins (:host:jvmTest)
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :host:jvmTest --console=plain
      # No Android SDK and no ebp.dir needed: :host depends on :wire
      # only, and the fat jar is what the ERT launcher spawns (a
      # JavaExec child would belong to the Gradle daemon's process
      # tree, leaving the launcher nothing it could signal).
      - name: Build the headless host
        working-directory: companion
        run: ./gradlew :host:fatJar --console=plain
      - name: ERT against the live host
        env:
          EBP_HOST_LAUNCH: >-
            java -jar companion/host/build/libs/host-all.jar --port 0 --kat
        run: test/run-tests.sh
