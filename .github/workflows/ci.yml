# RF-1a (PLAN-refound): the four jobs, no new dependencies.  Every
# green number stops being demonstrated-once the moment this file
# lands — red-on-regression is itself demonstrated by the three-red
# gate recorded in the RF-1a status note.
#
# Documented exclusions (no silent caps):
#   - renderer/accessibility device suites stay manual; the API 34 production
#     composition smoke now runs below as a managed-device gate;
#   - RF-1b (Robolectric render snapshots) and RF-1c (the
#     cross-implementation loopback job) are later rungs.
#   - the bundled flavor (docs/PLAN-bundled-emacs.md, E7) has its own jobs
#     below, bundled and api34-bundled: they download the engine AAR
#     gradle/engine.lock pins from the engine repository's GitHub release
#     and fail when that release does not carry it.
#
# Two non-obvious facts this file depends on (re-verified 2026-10-28):
#   - every job composes the sibling checkouts docs/LOCAL-REPOSITORY-LAYOUT.md
#     names, cloned beside this checkout from their GitHub default branches
#     by tools/ci-checkout-siblings.sh, which exports JETPACS_REPOSITORIES_ROOT:
#     the Gradle settings take the ebp-kmp and ebp-compose modules from it,
#     the onboarding-asset staging reads the Elisp siblings, and five :wire
#     jvmTest suites resolve fixtures through the ebp.dir system property
#     (wire/build.gradle.kts: the sibling ebp) and error() without it;
#   - local.properties is gitignored; the :app build finds the SDK via
#     the runner's preinstalled ANDROID_HOME.

name: CI

on:
  push:
    branches: ["main", "slop-fork/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    name: ebp-kmp + wire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sibling checkouts (docs/LOCAL-REPOSITORY-LAYOUT.md)
        run: tools/ci-checkout-siblings.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Wire suite (goldens + fixtures via ebp.dir)
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew \
            :ebp-kmp:jvmTest \
            :wire:jvmTest \
            --console=plain

  app:
    name: app (core + unit + lint + debug/release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sibling checkouts (docs/LOCAL-REPOSITORY-LAYOUT.md)
        run: tools/ci-checkout-siblings.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core caches, app tests, lint, and APKs
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew \
            :ebp-kmp:compileAndroidMain \
            :core:model:compileAndroidMain \
            :core:database:compileAndroidMain \
            :core:ebp-store:compileAndroidMain \
            :core:data:compileAndroidMain \
            :core:testing:compileAndroidMain \
            :core:navigation:compileAndroidMain \
            :core:navigation:jvmTest \
            :core:database:compileAndroidDeviceTestSources \
            :core:data:compileAndroidDeviceTestSources \
            :core:database:jvmTest \
            :core:ebp-store:jvmTest \
            :core:data:jvmTest \
            :core:testing:jvmTest \
            :app:testStandaloneDebugUnitTest \
            :app:lintStandaloneDebug \
            :app:lintStandaloneRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ebp-companion-debug-apk
          path: companion/app/build/outputs/apk/standalone/debug/*.apk
          retention-days: 14

  api34-device:
    name: Android 14 managed-device gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sibling checkouts (docs/LOCAL-REPOSITORY-LAYOUT.md)
        run: tools/ci-checkout-siblings.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room, Keystore, manifest, and app smoke on API 34
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :app:pixel2Api34StandaloneDebugAndroidTest --console=plain

  # The bundled flavor against the engine AAR gradle/engine.lock pins,
  # downloaded from the release engine-<id> of calebc42/jetpacs-emacs-engine
  # (assets spell "+" as "-"; tools/fetch-engine-aar.sh verifies the digest).
  # The engine repository is public, so the default token reads it. The
  # host Emacs byte-compiles the staged kit (companion/TESTING.md, "Bundled
  # engine"); its major version must be the engine's.
  bundled:
    name: "bundled (pinned engine AAR: unit + lint + debug APK)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sibling checkouts (docs/LOCAL-REPOSITORY-LAYOUT.md)
        run: tools/ci-checkout-siblings.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: purcell/setup-emacs@master
        with:
          version: "31.1"
      - name: Download the pinned engine AAR
        env:
          GH_TOKEN: ${{ secrets.JETPACS_ENGINE_TOKEN || github.token }}
        run: tools/fetch-engine-aar.sh "$RUNNER_TEMP/engine"
      - name: verifyBundledEngine, bundled unit tests, lint, debug APK
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:verifyBundledEngine \
            :app:testBundledDebugUnitTest \
            :app:lintBundledDebug \
            :app:assembleBundledDebug \
            --console=plain
      # The dump preload must not bake loadup-time state into the engine: no
      # files in HOME, no ~/org paths, every root defvar seed unbound
      # (tools/engine-preload-audit.el; the build above staged the kit).
      - name: Engine preload audit
        run: emacs -Q --batch -l tools/engine-preload-audit.el
      - name: Upload bundled debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ebp-companion-bundled-debug-apk
          path: companion/app/build/outputs/apk/bundled/debug/*.apk
          retention-days: 14

  api34-bundled:
    name: Android 14 managed-device gate (bundled, x86_64 engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sibling checkouts (docs/LOCAL-REPOSITORY-LAYOUT.md)
        run: tools/ci-checkout-siblings.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: purcell/setup-emacs@master
        with:
          version: "31.1"
      - name: Download the pinned engine AAR
        env:
          GH_TOKEN: ${{ secrets.JETPACS_ENGINE_TOKEN || github.token }}
        run: tools/fetch-engine-aar.sh "$RUNNER_TEMP/engine"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Composition smoke on API 34 with the x86_64 engine packaged
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :app:pixel2Api34BundledDebugAndroidTest --console=plain

  # The specification this composition builds against: the ebp sibling's
  # validate.py on its published head. (I1, the frozen submodule pointer
  # of the RF era, ended with the move to sibling checkouts.)
  spec:
    name: spec (validate.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sibling checkouts (docs/LOCAL-REPOSITORY-LAYOUT.md)
        run: tools/ci-checkout-siblings.sh
      - name: validate.py (goldens, contract, check_spec_sync)
        run: python3 "$JETPACS_REPOSITORIES_ROOT/ebp/validate.py"

  # Emacs 31.1: the committed applet registry build is checked byte for byte
  # against a fresh one, and an applet manifest's hash covers the Emacs
  # version that generated it (jetpacs-applet-tooling, :generator), so the
  # check holds only under the Emacs that rendered the committed files.
  # 31.1 is also the bundled engine's version.
  elisp:
    name: elisp (guards + ERT suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sibling checkouts (docs/LOCAL-REPOSITORY-LAYOUT.md)
        run: tools/ci-checkout-siblings.sh
      - uses: purcell/setup-emacs@master
        with:
          version: "31.1"
      - name: run-tests.sh (delineation guard, byte-compile guard, ERT)
        run: test/run-tests.sh
