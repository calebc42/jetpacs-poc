# RF-1a (PLAN-refound): the four jobs, no new dependencies.  Every
# green number stops being demonstrated-once the moment this file
# lands — red-on-regression is itself demonstrated by the three-red
# gate recorded in the RF-1a status note.
#
# Documented exclusions (no silent caps):
#   - renderer/accessibility device suites stay manual; the API 34 production
#     composition smoke now runs below as a managed-device gate;
#   - RF-1b (Robolectric render snapshots) and RF-1c (the
#     cross-implementation loopback job) are later rungs.
#
# Two non-obvious facts this file depends on (verified 2026-07-31):
#   - the WIRE job, not the spec job, is the real cross-repo binding:
#     five :wire jvmTest suites resolve fixtures through the ebp.dir
#     system property (wired in wire/build.gradle.kts) and error()
#     when unset — hence submodules: recursive on every job that
#     touches Gradle or validate.py;
#   - local.properties is gitignored; the :app build finds the SDK via
#     the runner's preinstalled ANDROID_HOME.

name: CI

on:
  push:
    branches: ["slop-fork/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    name: ebp-kmp + wire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Wire suite (goldens + fixtures via ebp.dir)
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew \
            :ebp-kmp:jvmTest \
            :wire:jvmTest \
            --console=plain

  app:
    name: app (core + unit + lint + debug/release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core caches, app tests, lint, and APKs
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew \
            :ebp-kmp:compileAndroidMain \
            :core:model:compileAndroidMain \
            :core:database:compileAndroidMain \
            :core:ebp-store:compileAndroidMain \
            :core:data:compileAndroidMain \
            :core:testing:compileAndroidMain \
            :core:navigation:compileAndroidMain \
            :core:navigation:jvmTest \
            :core:database:compileAndroidDeviceTestSources \
            :core:data:compileAndroidDeviceTestSources \
            :core:database:jvmTest \
            :core:ebp-store:jvmTest \
            :core:data:jvmTest \
            :core:testing:jvmTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ebp-companion-debug-apk
          path: companion/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  api34-device:
    name: Android 14 managed-device gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room, Keystore, manifest, and app smoke on API 34
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :app:pixel2Api34DebugAndroidTest --console=plain

  spec:
    name: spec (validate.py + I1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # I1: ebp/ is frozen through RF-2.  In a fresh checkout the
      # working-tree half is vacuous by construction; the load-bearing
      # halves are the in-sync submodule pointer and validate.py green
      # against exactly the pinned artifacts.
      - name: I1 — submodule in sync, tree clean
        run: |
          git submodule status ebp | grep -q '^ ' \
            || { echo "submodule pointer out of sync"; exit 1; }
          test -z "$(git status --short ebp/)" \
            || { git status --short ebp/; exit 1; }
      - name: validate.py (goldens, contract, check_spec_sync)
        run: python3 ebp/validate.py

  elisp:
    name: elisp (guards + ERT suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - name: run-tests.sh (delineation guard, byte-compile guard, ERT)
        run: test/run-tests.sh
